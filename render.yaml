# Render Blueprint — despliega backend + IA (+ frontend opcional) de una vez.
# Uso: Render Dashboard → New → Blueprint → conecta el repo.
# Las variables con `sync: false` las rellenas tú en el panel tras el primer deploy.
#
# La MySQL NO va aquí: se crea aparte en Railway (o Aiven) y pegas sus datos
# en DB_HOST / DB_PORT / DB_USER / DB_PASSWORD / DB_NAME de los dos servicios.

services:
  # ── Backend Node/Express ────────────────────────────────────────────────
  - type: web
    name: gams-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: IA_URL
        value: https://gams-ia.onrender.com
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        value: mailto:admin@gams.gob.bo

  # ── Servicio de IA (FastAPI) ────────────────────────────────────────────
  - type: web
    name: gams-ia
    runtime: python
    plan: free
    rootDir: python_ia
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "false"

  # ── Frontend React (CRA) — opcional; Vercel/Netlify también sirve ───────
  - type: web
    name: gams-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
